name: Test formulas
# Installs and tests every formula on macOS and Linux whenever one changes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Homebrew on Linux
        if: runner.os == 'Linux'
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - name: Install, test and audit each formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew tap-new --no-git local/check
          cp Formula/*.rb "$(brew --repository local/check)/Formula/"
          for formula in Formula/*.rb; do
            name="$(basename "$formula" .rb)"
            brew install "local/check/$name"
            brew test "local/check/$name"
            brew style "local/check/$name"
          done
